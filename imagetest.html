<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Print & Photoshop Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        #canvasContainer {
            display: none;
            text-align: center;
            margin:top  300px; 
            margin:left  400px ;
            margin-right: 0;
            margin: bottom  0;
        }
        #editCanvas {
            border: 1px solid #ddd;
            background-color: white;
        }
    </style>
</head>
<body>
    
</div>
<button type="button" id="backButton" class="btn mt-3" style="background-color: #2596be; margin-left: 20px;">Back</button>

    <div class="container mt-5">
        <form class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="documentUpload" class="form-label">Upload Your Image</label>
                <input type="file" class="form-control" id="documentUpload" accept="image/*" required>
                <div class="invalid-feedback">Please upload an image.</div>
            </div>
            <div id="canvasContainer">
                <canvas id="editCanvas" width="113.38" height="166" style="margin-left: 50px; margin-top: 30;" ></canvas>
                <br>
                <label for="brightnessRange" class="form-label">Brightness</label>
                <input type="range" id="brightnessRange" min="50" max="200" value="100">
                <br>
                
                <!-- <button type="button" id="resetButton" class="btn btn-secondary">Reset</button> -->
                
<button type="button" id="resizeButton" class="btn btn-primary" style="margin-right: 20px;">Resize to Canvas</button>
<button type="button" id="resetBrightnessButton" class="btn btn-warning" style="margin-right: 20px;">Reset Brightness</button>
                <button type="button" id="printButton" class="btn btn-outline-primary" disabled>Print</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script>
  // Event listener for brightness slider
document.getElementById("brightnessRange").addEventListener("input", function () {
    const brightnessValue = parseInt(this.value);

    if (fabricImage) {
        // Clear previous brightness filter
        fabricImage.filters = [];

        // Apply brightness filter using the slider value
        fabricImage.filters.push(new fabric.Image.filters.Brightness({
            brightness: (brightnessValue - 100) / 100  // Adjust range to between -1 and 1
        }));

        // Apply the filter and update the canvas
        fabricImage.applyFilters();
        fabricCanvas.renderAll();
    }
});


        
     
        document.getElementById("printButton").addEventListener("click", function () {
    if (fabricCanvas) {
        const dataUrl = fabricCanvas.toDataURL();
        const newWindow = window.open('', '_blank');
        newWindow.document.write('<img src="' + dataUrl + '" id="printImage">');
        newWindow.document.close();

        newWindow.onload = function () {
            const image = newWindow.document.getElementById('printImage');
            if (image) {
                // Add print-specific CSS styles directly to the print window
                const style = newWindow.document.createElement('style');
                style.innerHTML = `
                    @media print {
                        #printImage {
                            width: 3cm;
                            height: 4.4cm;
                            margin-left: 0.27cm;  /* Set left margin */
                            margin-top: 0.65cm;   /* Set top margin */
                            display: block;    /* Ensure block-level to respect margins */
                            page-break-before: always;  /* Optional: ensures the image starts a new page */
                        }
                    }
                `;
                newWindow.document.head.appendChild(style);
            }
            newWindow.print();
        };
    }
});

        let fabricCanvas = new fabric.Canvas("editCanvas");
        let fabricImage;
        document.getElementById("documentUpload").addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    fabricCanvas.clear();
                    fabric.Image.fromURL(e.target.result, function (img) {
                        fabricImage = img;
                        img.set({
                            left: 0,
                            top: -3,
                            scaleX: 0.5,
                            scaleY: 0.5,
                            selectable: true,
                        });
                        fabricCanvas.add(img);
                        fabricCanvas.setActiveObject(img);
                        fabricCanvas.renderAll();
                        document.getElementById("canvasContainer").style.display = "block";
                        document.getElementById("printButton").disabled = false;
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById("backButton").addEventListener("click", function() {
    window.history.back();
});
document.getElementById("resizeButton").addEventListener("click", function () {
    if (fabricImage) {
        // Get the current canvas dimensions
        const canvasWidth = fabricCanvas.width;
        const canvasHeight = fabricCanvas.height;

        // Resize the image to fully fit the canvas
        fabricImage.set({
            scaleX: canvasWidth / fabricImage.width,
            scaleY: canvasHeight / fabricImage.height,
            left: 0, 
            top: 0,
            opacity: 1, 
        });

        fabricCanvas.renderAll();
    }
});
document.getElementById("resetBrightnessButton").addEventListener("click", function () {
    if (fabricImage) {
        // Reset brightness filter
        fabricImage.filters = [];
        fabricImage.applyFilters();

        // Reset brightness slider to default value
        document.getElementById("brightnessRange").value = 100;

        // Render the canvas to reflect the changes
        fabricCanvas.renderAll();
    }
});
    </script>
</body>
</html>
